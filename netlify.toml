[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Send www to the apex host. Netlify already upgrades http://dilzeen.com to HTTPS.
[[redirects]]
  from = "https://www.dilzeen.com/*"
  to = "https://dilzeen.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://www.dilzeen.com/*"
  to = "https://dilzeen.com/:splat"
  status = 301
  force = true

# Do not add /page -> /page/ redirects here. Netlify matches those paths with or
# without a trailing slash, so a forced slash redirect loops on itself.
# Canonical tags still use the trailing-slash URL.