[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Send www to the apex host. Netlify already upgrades http://dilzeen.com to HTTPS.
[[redirects]]
  from = "https://www.dilzeen.com/*"
  to = "https://dilzeen.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://www.dilzeen.com/*"
  to = "https://dilzeen.com/:splat"
  status = 301
  force = true

# Canonical pages use a trailing slash. These rules match only those page paths,
# so files such as images, the sitemap, and robots.txt are left alone.
[[redirects]]
  from = "/about"
  to = "/about/"
  status = 301
  force = true

